<!DOCTYPE html>

<!-- Atividade 2 - Web -->

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Atividade 3 - Página de Produtos Estilizada</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <h1>Produtos</h1>
        </header>

        <main>
            <section>
                <h2>Produtos Disponíveis</h2>
                <div class="container">
                    <div class="card">
                        <img src="https://cdn2.steamgriddb.com/icon/f0e95622d20a747e93f5403e5193b155.ico">
                        <h3>Hollow Knight Silksong</h3>
                        <br>
                        <span class="preco">R$ 59,99</span>
                        <br>
                        <button class="botao_detalhes"><a href="https://store.steampowered.com/app/1030300/Hollow_Knight_Silksong/">Página do Jogo</a></button>
                    </div>
                    <div class="card">
                        <img src="https://cdn2.steamgriddb.com/icon/2de7d0c3ccdae68cf66c4d7aafaae7cd.ico">
                        <h3>Kingdom Hearts 3</h3>
                        <br>
                        <span class="preco">R$ 249,90</span>
                        <br>
                        <button class="botao_detalhes"><a href="https://store.steampowered.com/app/2552450/KINGDOM_HEARTS_III__Re_Mind_DLC/">Página do Jogo</a></button>
                    </div>
                    <div class="card">
                        <img src="https://amiibo.life/assets/games/eshop_icons/switch/mega-man-11-48ca10832a260551ae5fe1b63eff9abba23e178e9d846012366cc983a3eba232.png">
                        <h3>Mega Man 11</h3>
                        <br>
                        <span class="preco">R$ 129,00</span>
                        <br>
                        <button class="botao_detalhes"><a href="https://store.steampowered.com/app/742300/Mega_Man_11/">Página do Jogo</a></button>
                    </div>
                </div>
            </section>
            <section>
                <form method="post" action="/products">
                    <button>[ Cadastrar Novo Produto ]</button>
                </form>
            </section>
        </main>

        <footer>Minha Loja</footer>
        <script src="script.js"></script>
    </body>
</html>
